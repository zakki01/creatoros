name: CreatorOS E2E Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Run daily at 04:00 UTC

jobs:
  e2e-smoke:
    name: Critical User Journeys Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright / Puppeteer Browsers
        run: npx playwright install chromium --with-deps || true

      - name: Run E2E Journey Tests
        run: npm run test:e2e
        env:
          PROD_URL: 'https://creatoros-fawn-iota.vercel.app'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://fthqnbqqsgfkotsmsjgz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0aHFuYnFxc2dma290c21zamd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDIwMDYsImV4cCI6MjEwODg3ODAwNn0.X3z-fWrjyKymWwF_p5rGsNgibuOk7e7BUS7rGqdviJE' }}
